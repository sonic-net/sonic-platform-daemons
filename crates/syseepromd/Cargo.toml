[package]
name = "sonic-syseepromd-rs"
version = "1.0.0"
edition = "2021"
authors = ["SONiC Team <sonic-dev@lists.sonicfoundation.dev>"]
description = "SONiC system EEPROM daemon in Rust"
license = "Apache-2.0"

[[bin]]
name = "syseepromd-rs"
path = "src/main.rs"

[dependencies]
platform-api  = { workspace = true }
# Every implementation of that trait, behind one type.  This daemon names none
# of them: which one it opens is the `--platform-api` switch, and a new
# implementation arriving changes nothing here.
platform-provider = { workspace = true }
pmon-common   = { path = "../pmon-common" }
# One table, one timer, three signals -- a current-thread runtime is the whole
# requirement, and the thread count is something this port is measured on.
tokio = { version = "1", features = ["rt", "macros", "time", "signal"] }
# Held below 4.6 for the same reason thermalctld holds it: from 4.6 the clap
# family is edition 2024, which the cargo-auditable the slave image wraps
# rustc in cannot parse out of `cargo metadata`.
clap  = { version = ">=4.0, <4.6", features = ["derive"] }
log   = "0.4"

[dev-dependencies]
# `Cycles::Fixed` is the seam that lets a test drive the loop.
pmon-common = { path = "../pmon-common", features = ["testing"] }
tokio = { version = "1", features = ["rt", "macros", "time", "signal", "test-util"] }
