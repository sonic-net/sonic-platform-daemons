[package]
name = "sonic-chassisd-rs"
version = "1.0.0"
edition = "2021"
authors = ["SONiC Team <sonic-dev@lists.sonicfoundation.dev>"]
description = "SONiC chassis and DPU management daemon in Rust"
license = "Apache-2.0"

[[bin]]
name = "chassisd"
path = "src/main.rs"

[dependencies]
platform-api  = { workspace = true }
# Every implementation of that trait, behind one type.  This daemon names
# none of them: which one it opens is the `--platform-api` switch, and a new
# implementation arriving changes nothing here.
platform-provider = { workspace = true }
pmon-common   = { path = "../pmon-common" }
# The CONFIG_DB watcher subscribes rather than polls, so `config chassis
# modules shutdown` takes effect now and not on the next ten-second cycle.
swss-common   = { workspace = true }
# `spawn_blocking` for that watcher, which blocks in select().
tokio = { version = "1", features = ["rt", "macros", "time", "signal"] }
# Cargo.lock retains the validated graph; current master uses cargo-auditable 0.7.6.
clap  = { version = "4", features = ["derive"] }
log   = "0.4"
# platform.json carries the DPU recovery thresholds.
serde_json = "1"
chrono = "0.4"

[dev-dependencies]
# The reboot-cause history is real files under /host; the tests point the same
# code at a directory they own.
tempfile = "3"
# `Cycles::Fixed` is the seam that lets a test drive the loop.
pmon-common = { path = "../pmon-common", features = ["testing"] }
tokio = { version = "1", features = ["rt", "macros", "time", "signal", "test-util"] }

[features]
# The Python daemon run against this one (`src/parity`, harness in
# `pmon_common::parity`).  Off by default: it embeds Python and imports
# sonic_py_common, sonic_platform_base and the Python daemon's own imports,
# none of which the deb build's `cargo test` (debian/rules) has.  The repo's
# CI turns it on; with it on, a module that cannot be imported fails the test.
parity = ["pmon-common/parity"]
