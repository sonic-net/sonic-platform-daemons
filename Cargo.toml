# Rust half of sonic-platform-daemons.  The Python daemons beside it are
# unchanged; this workspace holds their Rust counterparts, the way
# sonic-swss-common carries crates/ beside its C++.
[workspace]
members  = [
    "crates/pmon-common",
    "crates/psud",
    "crates/thermalctld",
]
resolver = "2"

# The crates the daemons share with the rest of SONiC, taken from git the way
# sonic-swss and sonic-dash-ha take swss-common; Cargo.lock pins the commits.
# sonic-buildimage builds against its own submodules instead (debian/rules).
[workspace.dependencies]
platform-api      = { git = "https://github.com/sonic-net/sonic-platform-common.git", branch = "master" }
platform-provider = { git = "https://github.com/sonic-net/sonic-platform-common.git", branch = "master" }
swss-common       = { git = "https://github.com/sonic-net/sonic-swss-common.git", branch = "master" }

# Profiles only take effect at the workspace root; cargo ignores them in a
# member manifest.  panic = "unwind" so that a panic ends only the thread it
# happens on, and each thread a daemon starts decides what that means for the
# daemon (pmon_common::thread): a thread the daemon cannot run without aborts
# the process, and supervisord restarts it; a thread that does one job for one
# caller logs the panic and ends, as a Python thread does.  "abort" would make
# every panic the first kind: cargo takes the panic strategy per build, not
# per crate, and under "abort" nothing can catch a panic at all.
[profile.release]
lto            = true
codegen-units  = 1
panic          = "unwind"
